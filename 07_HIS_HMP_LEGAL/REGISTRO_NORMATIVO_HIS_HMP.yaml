  - id: NORMA-008
    titulo: "Endurecimento do controle de destinação de HIS e HMP"
    tipo: decreto_municipal
    numero: "64.244/2025"
    fonte_oficial: "Diário Oficial da Cidade"
    fontes_registro: [F05, F06, F07, F12, F16]
    data_publicacao: "2025-05-28"
    vigencia_inicio: null           # a confirmar
    vigencia_fim: null
    abrangencia: "Alienação e locação de unidades HIS-1, HIS-2 e HMP"
    conteudo_operacional: >
      (a) destinação depende de certidão emitida pelo Município atestando a faixa de renda,
      em substituição à autodeclaração; (b) comprovação na assinatura do compromisso ou do
      contrato de compra e venda; (c) conceito ampliado de família da Lei federal 13.982/2020;
      (d) Certificado de Conclusão condicionado à averbação do enquadramento nas matrículas;
      (e) aluguel limitado a 30% da renda familiar máxima da faixa; contratos com cláusula de
      enquadramento; (f) proibição de locação por temporada (prazo inferior a 90 dias),
      vedação permanente; (g) SEHAB e Subprefeituras podem requisitar documentos.
    impacto_classificacao: >
      A averbação em matrícula passa a ser a evidência mais forte de classificação por
      unidade. Anúncio de locação curta de unidade HIS/HMP é indício de irregularidade.
    status_verificacao: busca_indexada
    requer_validacao_juridica: true
    data_ultima_verificacao: "2026-11-21"

