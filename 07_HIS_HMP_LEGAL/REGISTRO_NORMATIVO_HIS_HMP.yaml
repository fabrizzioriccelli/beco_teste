normas:
  - id: NORMA-001
    titulo: "Plano Diretor Estratégico (PDE)"
    tipo: lei_municipal
    numero: "16.050/2014"
    fonte_oficial: "Câmara Municipal de São Paulo / Diário Oficial da Cidade"
    fontes_registro: [F01, F10]
    data_publicacao: "2014-07-31"   # a confirmar no DOC
    vigencia_inicio: "2014-08-01"   # a confirmar
    vigencia_fim: null
    abrangencia: "Município de São Paulo"
    conteudo_operacional: >
      Art. 46 define faixas: HIS-1 até 3 SM de renda familiar mensal ou 0,5 SM per capita;
      HIS-2 até 6 SM ou 1 SM per capita; HMP até 10 SM ou 1,5 SM per capita.
      Define EHIS, EHMP, EZEIS e percentuais por tipo de ZEIS (Quadro 4), com redação
      alterada pela Lei 17.975/2023.
    impacto_classificacao: "Base das faixas de renda e das categorias HIS-1, HIS-2, HMP"
    status_verificacao: busca_indexada
    requer_validacao_juridica: true
    pendencias:
      - "Extrair percentuais do Quadro 4 (ZEIS 1 a 5) na redação vigente"
      - "Extrair definições exatas de EHIS, EHMP e EZEIS"
    data_ultima_verificacao: "2026-11-21"

  - id: NORMA-002
    titulo: "Revisão intermediária do PDE"
    tipo: lei_municipal
    numero: "17.975/2023"
    fonte_oficial: "https://www.saopaulo.sp.leg.br/iah/fulltext/leis/L17975.pdf"
    fontes_registro: [F10]
    data_publicacao: "2023-07"      # sancionada em julho/2023; dia a confirmar
    vigencia_inicio: null           # a confirmar
    vigencia_fim: null
    abrangencia: "Município de São Paulo"
    conteudo_operacional: >
      Cerca de 120 artigos de ajuste ao PDE. Aperfeiçoa a caracterização de HIS e HMP;
      permite destinar unidades total ou parcialmente à locação; regras de adensamento
      para habitação popular em ZEIS 2, 3 e 5 no entorno dos Eixos.
    impacto_classificacao: "Altera definições e incentivos de HIS/HMP; afeta EZEIS"
    status_verificacao: busca_indexada
    requer_validacao_juridica: true
    data_ultima_verificacao: "2026-11-21"

