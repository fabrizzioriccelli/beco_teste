# BECO — Registro normativo HIS/HMP (semente da Fase 0)
#
# Objetivo: base versionada das normas e parâmetros que afetam a classificação
# de empreendimentos e unidades HIS/HMP no Município de São Paulo.
#
# Campos exigidos pelo briefing (seção 8.1): identificação, fonte oficial, data de
# publicação, data de vigência, abrangência, interpretação operacional, impacto
# sobre a classificação e data da última verificação.
#
# Status de verificação:
#   busca_indexada       -> conteúdo lido em trecho indexado; texto integral NÃO lido
#   texto_integral       -> texto oficial lido e conferido (nenhum ainda)
#   validado_juridico    -> revisado por advogado (nenhum ainda)
#   nao_confirmado       -> informação conflitante ou de fonte única
#
# AVISO: inteligência de mercado, não parecer jurídico. Nenhuma regra deste arquivo
# deve alimentar classificação em produção antes de status texto_integral e, quando
# marcado, validado_juridico.

meta:
  versao_registro: "0.1"
  municipio: "São Paulo/SP"
